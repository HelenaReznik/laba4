<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Заказать пончики</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>

        <div class="page-title">
            <h1>Заказать пончики 🍩</h1>
            <p>Собери свой сладкий заказ!</p>
        </div>

        <nav>
            <a href="index.html">Главная</a>
            <a href="donuts.html">Наши пончики</a>
            <a href="order.html">Заказать</a>
        </nav>

    </header>

    <main>

        <section class="order">

            <h2>Оформление заказа</h2>

            <label for="donut">Выберите пончик:</label>

            <select id="donut">
                <option value="150">Шоколадный — 150 ₽</option>
                <option value="170">Клубничный — 170 ₽</option>
                <option value="160">Карамельный — 160 ₽</option>
            </select>

            <label for="quantity">Количество:</label>

            <input type="number" id="quantity" value="1" min="1">

            <label for="topping">Дополнительная начинка:</label>

            <select id="topping">
                <option value="0">Без начинки — 0 ₽</option>
                <option value="30">Шоколад — 30 ₽</option>
                <option value="40">Клубника — 40 ₽</option>
                <option value="35">Карамель — 35 ₽</option>
            </select>

            <button onclick="calculateOrder()">
                Рассчитать стоимость 🍩
            </button>

            <div id="result"></div>

        </section>

    </main>

    <footer>
        <p>© 2026 «Пончик в дом» 🍩</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
